# Local-only overrides. Host ports 80/443 are used by another stack on this
# machine, so JobHunter's edge is remapped:
#   https://localhost:8443/api/...   https://localhost:8443/n8n/   /monitor/
# Delete this file (or change the mappings) on a host where 80/443 are free.
services:
  caddy:
    # !override replaces the base ports list instead of appending to it.
    ports: !override
      - "8080:80"
      - "8443:443"
