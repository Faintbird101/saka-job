# ============================================================
#  Full local stack. Caddy is the ONLY thing exposed to the
#  host (80/443). backend, n8n, postgres, beszel are reachable
#  only on the internal Docker network — that is the hardening.
# ============================================================
services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [backend, n8n, beszel]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # NOTE: no host port published — only reachable inside the network.
    # (Add "ports: 5432:5432" temporarily if you need psql from the host.)
    volumes: ["pgdata:/var/lib/postgresql/data"]

  backend:
    build: { context: ../backend, dockerfile: ../infra/docker/backend.Dockerfile }
    env_file: [../.env]
    # NOT exposed to host anymore — Caddy proxies /api/* to it.
    expose: ["8080"]
    depends_on: [postgres]

  n8n:
    image: n8nio/n8n:latest
    env_file: [../.env]
    environment:
      # Tell n8n it lives behind Caddy under /n8n.
      N8N_PATH: /n8n/
      N8N_PROXY_HOPS: "1"
      WEBHOOK_URL: https://localhost/n8n/
    expose: ["5678"]
    volumes: ["n8ndata:/home/node/.n8n"]
    depends_on: [postgres]

  # --- Beszel monitoring: hub (dashboard) + agent (metrics collector) ---
  beszel:
    image: henrygd/beszel:latest
    expose: ["8090"]
    volumes: ["beszeldata:/beszel_data"]

  beszel-agent:
    image: henrygd/beszel-agent:latest
    network_mode: host          # agent needs host visibility for real stats
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # PORT + KEY are set after you register the agent in the Beszel UI.
      PORT: "45876"
      KEY: "${BESZEL_AGENT_KEY:-}"
    depends_on: [beszel]

volumes:
  pgdata:
  n8ndata:
  caddydata:
  caddyconfig:
  beszeldata:
